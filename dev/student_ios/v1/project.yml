name: TomoshibiApp
options:
  bundleIdPrefix: com.itsuki
  deploymentTarget:
    iOS: "16.0"          # 最低支持 iOS 16（itsuki 2026-06-05 拍板）
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# 三套编译配置：Debug / Release = 正式版（production）；Demo = 演示版（带 DEMO 编译开关）
# 写进 project.yml 后 xcodegen 重新生成工程也不会丢
# （历史教训：Demo 配置原来只手动配在 Xcode 里、没进 project.yml，xcodegen generate 一跑就被擦掉）
configs:
  Debug: debug
  Release: release
  Demo: debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 苹果开发者团队编号（itsuki 2026-06-11 提供）— Archive/上架签名用。memory: project_ios_apple_team_id
    DEVELOPMENT_TEAM: DCQ2KT5ZA9
    CODE_SIGN_STYLE: Automatic                # 自动签名：Xcode 按 Team 拉/建描述文件（Archive 需 Xcode 登录该账号）
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_MODULE_VERIFIER: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"       # 最低支持 iOS 16（itsuki 2026-06-05 拍板）
    TARGETED_DEVICE_FAMILY: "1"              # iPhone only
    # 以下两条 = Xcode 26「更新到推荐设置」弹窗里勾选的项，写进 project.yml 才不会被 xcodegen 重新生成时擦掉
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"     # 给构建脚本上沙箱（本工程无脚本阶段，纯打开苹果推荐开关）
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"   # 字符串目录符号生成（本工程暂无 .xcstrings 文件，开着备用、消掉提醒）

targets:
  TomoshibiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TomoshibiApp
        excludes:
          - Assets.xcassets.empty
          - AppIcon-1024.png        # 散落旧 PNG，与 AppIcon.icon/ 重复且未被引用 — 排除防再纳入工程（2026-06-17）
          - .ruff_cache             # Python ruff 缓存误落 iOS 源树 — 排除防 xcodegen 扫进来（2026-06-17）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsuki.tomoshibi      # 正式版 bundle id
        PRODUCT_NAME: TomoshibiApp
        # 相机权限说明 — 在线学习申请拍摄契約書（合同）照片用；不声明会闪退
        INFOPLIST_KEY_NSCameraUsageDescription: "オンライン学習の契約書を撮影するためにカメラを使用します"
        # NFC 用途说明（iosnfc-③ 上线缺口）— 手机点呼把学号写进点呼机 NFC 芯片时系统弹的提示；不声明 CoreNFC 一调就闪退
        INFOPLIST_KEY_NFCReaderUsageDescription: "点呼の出席を点呼機に送信するために NFC を使用します"
        # 加密合规标志（iosenc-⑩ 上线缺口）— app 只走标准 HTTPS、属苹果豁免类，填 NO 免每次上传 App Store 手填问询
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # 推送 + NFC 权限声明文件接线 — 把 TomoshibiApp.entitlements 挂进构建（aps-environment 推送 + NFC 受限能力）
        # 签名已就绪：DEVELOPMENT_TEAM 已填 + CODE_SIGNING_ALLOWED YES（见上 base 段），Archive 上架时 Xcode 自动签名拉描述文件
        CODE_SIGN_ENTITLEMENTS: TomoshibiApp/TomoshibiApp.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Tomoshibi
        INFOPLIST_KEY_CFBundleShortVersionString: "0.23.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        # 弱链接（weak link）FoundationModels(iOS26) / Translation(iOS18) — 这两框架在 iOS16〜25 不存在。
        # 代码里调用全有 if #available 守卫，但默认硬链接（LC_LOAD_DYLIB）会让旧系统启动时 dyld 找不到框架直接崩。
        # -weak_framework 改成弱链接：框架缺席时不崩、符号延迟解析。每个框架名前各带一个 -weak_framework。
        # ⚠️ iOS26 模拟器测不出旧系统崩溃 — 需在 iOS16~17 真机/模拟器回归确认（2026-06-17）。
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "FoundationModels"
          - "-weak_framework"
          - "Translation"
      configs:
        Demo:
          # 演示版：独立 bundle id（跟正式版不冲突、模拟器上可同时装两个）
          # + DEMO 编译开关（打开 magic 登录 00/demo1234 + 各页面预填演示数据）
          PRODUCT_BUNDLE_IDENTIFIER: com.itsuki.tomoshibi.demo
          INFOPLIST_KEY_CFBundleDisplayName: Tomoshibi Demo
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DEMO"

  # 单元测试目标（iOS 首批逻辑测试，2026-06-11）— 宿主 TomoshibiApp，@testable import 测纯函数
  TomoshibiAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TomoshibiAppTests
    dependencies:
      - target: TomoshibiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsuki.tomoshibi.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # 宿主 app 跑模拟器测试不需签名（与主 target 一致关签名）
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  TomoshibiApp:                # 正式版 scheme（含单元测试）
    build:
      targets:
        TomoshibiApp: all
        TomoshibiAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TomoshibiAppTests
    archive:
      config: Release
  TomoshibiAppDemo:            # 演示版 scheme（顶部 scheme 切换器选这个 = 演示版）
    build:
      targets:
        TomoshibiApp: all
    run:
      config: Demo
