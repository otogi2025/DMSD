# Tomoshibi backend — VPS 部署 compose stack
# 三服务：fastapi (gunicorn) + postgres + caddy（HTTPS 反代）
# 用法：
#   docker compose up -d        # 后台启动全部
#   docker compose logs -f api  # 看 API 日志
#   docker compose exec api python -m seed  # 跑生产 seed（首次部署 1 次）
#   docker compose exec api alembic upgrade head  # 跑 migration

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tomoshibi}
      POSTGRES_USER: ${POSTGRES_USER:-tomoshibi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tomoshibi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 不暴露 5432 到公网，只在内部网络用

  api:
    build: .
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tomoshibi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tomoshibi}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_MIN: ${JWT_ACCESS_EXPIRE_MIN:-525600}  # 1 年=持久登录（与 config.py 默认一致，别漏改这处否则生产仍 24h）
      CORS_ORIGINS: ${CORS_ORIGINS:-https://api.tomoshibi.cc}
      # 邮件发送（Resend）— 不配则生产邮件静默失效，注册确认/通知全部丢弃
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Tomoshibi}
      # 日志级别（不配则用应用默认值，生产建议 WARNING 或 INFO）
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # seed.py 首次部署用 — 创建 admin/reviewer 账号的初始密码和注册码
      # 这三个变量必须在 .env 里设好，否则 `docker compose exec api python -m seed` 会失败
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD}
      REVIEWER_REGISTRATION_CODE: ${REVIEWER_REGISTRATION_CODE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 契約書文件（在线学习申请上传的照片/PDF）持久化 — 容器重建/更新不丢（itsuki 2026-06-14 上架审查补）
      # 挂载点 /app/uploads 已在 Dockerfile 预建 + chown tomoshibi，卷首次挂载继承属主，非 root 用户可写
      - uploads_data:/app/uploads
    # 不直接暴露 8000 到公网，让 Caddy 反代

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:
