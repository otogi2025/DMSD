# 老师网页 CI — push / PR 改了 teacher_web 后自动跑类型检查 + 构建
# 后端 pytest 早有专属配置（.github/workflows/test.yml，5-21 建）— 本文件不重复，只补老师网页这块。
# 注意：push 到 GitHub 之前不生效，首次 push 后看 Actions 页签，红了再修。

name: teacher-web

on:
  push:
    branches: [main]
    paths:
      - "dev/teacher_web/v1/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "dev/teacher_web/v1/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    name: 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dev/teacher_web/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dev/teacher_web/v1/package-lock.json
      - name: 装依赖
        run: npm ci
      - name: 类型检查 + 构建
        run: npm run build
