# DMSD 持续集成（CI）— push / PR 后 GitHub 服务器自动跑测试
# itsuki 2026-06-11 拍板上线。第一版只覆盖后端 + 老师网页（跑在免费的 Linux 机器上）；
# iOS / Android 需要别的运行环境（macOS 机器 / Android 工具链），等这版跑稳了再加。
# 注意：本文件 push 到 GitHub 之前不会生效，也没法在本地验证 — 首次 push 后看 Actions 页签，红了再修。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_dev/backend/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03_dev/backend/v1/requirements.txt
      - name: 装依赖
        run: pip install -r requirements.txt
      - name: 跑全量测试
        run: python -m pytest -q

  teacher_web:
    name: 老师网页 类型检查+构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_dev/teacher_web/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 03_dev/teacher_web/v1/package-lock.json
      - name: 装依赖
        run: npm ci
      - name: 类型检查 + 构建
        run: npm run build
