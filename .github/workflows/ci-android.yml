# Android CI — push / PR 改了 student_android 后自动跑单元测试 + Debug 编译（C 组质量体系 C2/§4.3，2026-07-13 建）
# 本地验证规矩（./gradlew testDebugUnitTest assembleDebug）搬进 CI。
# 注意：push 到 GitHub 之前不生效；首次 push 后看 Actions 页签，红了再修。

name: android

on:
  push:
    branches: [main]
    paths:
      - "dev/student_android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "dev/student_android/**"
      - ".github/workflows/ci-android.yml"

jobs:
  test-and-build:
    name: 单元测试 + Debug 编译
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dev/student_android/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（点呼判定 / 房号编码 / 状态映射 / 解码 / token 往返 / JST 格式化）
        run: ./gradlew testDebugUnitTest

      - name: Debug 编译
        run: ./gradlew assembleDebug
