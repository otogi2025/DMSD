      const GROUPS = [
        { k: "A", label: "🔴 A · 中文词漏进日语界面（老师直接看不懂，必改）" },
        { k: "B", label: "🟠 B · 不是中文词但日语不地道（建议改）" },
        { k: "C", label: "🟡 C · 同一个东西前后叫法不一样（一致性）" },
        { k: "D", label: "🟢 D · 半角标点该用全角（批量小改）" },

        { k: "F", label: "⚪ F · 要你拍板（可能故意留的 / demo 残留）" },
      ];

      const KEY = "dmsd_ja_audit_2026-06-05";
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      } catch (e) {
        saved = {};
      }
      let curFilter = "all";

      function idOf(d, i) {
        return d.file + "#" + d.line + "#" + i;
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        let gi = 0;
        GROUPS.forEach((g) => {
          const rows = DATA.map((d, i) => ({ d, i })).filter(
            (x) => x.d.level === g.k,
          );
          if (!rows.length) return;
          const sec = document.createElement("section");
          sec.className = "group";
          const cnt = rows.length;
          sec.innerHTML = `<div class="ghead">${g.label} <span class="cnt">（${cnt} 条）</span></div>`;
          const tbl = document.createElement("table");
          tbl.innerHTML = `<thead><tr>
      <th class="chk">不改</th><th>位置</th><th>问题</th>
      <th>原文（现在）</th><th>建议改成</th><th>中文翻译</th></tr></thead>`;
          const tb = document.createElement("tbody");
          rows.forEach(({ d, i }) => {
            const id = idOf(d, i);
            const done = !!saved[id];
            const tr = document.createElement("tr");
            tr.className = "lv" + d.level + (done ? " done" : "");
            tr.dataset.id = id;
            tr.dataset.done = done ? "1" : "0";
            const tdc = document.createElement("td");
            tdc.className = "chk";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = done;
            cb.onchange = () => toggle(id, cb.checked, tr);
            tdc.appendChild(cb);
            tr.appendChild(tdc);
            tr.appendChild(cell("loc", d.file + "\n:" + d.line));
            tr.appendChild(cell("type", d.type));
            tr.appendChild(cell("ja orig", d.orig));
            tr.appendChild(cell("ja sug", d.sug));
            tr.appendChild(cell("cn", d.cn));
            tb.appendChild(tr);
          });
          tbl.appendChild(tb);
          sec.appendChild(tbl);
          app.appendChild(sec);
          gi++;
        });
        applyFilter();
        updateStats();
      }
      function cell(cls, txt) {
        const td = document.createElement("td");
        td.className = cls;
        td.textContent = txt;
        return td;
      }

      function toggle(id, val, tr) {
        if (val) saved[id] = 1;
        else delete saved[id];
        localStorage.setItem(KEY, JSON.stringify(saved));
        tr.classList.toggle("done", val);
        tr.dataset.done = val ? "1" : "0";
        applyFilter();
        updateStats();
      }
      function updateStats() {
        const total = DATA.length;
        const done = Object.keys(saved).length;
        const todo = total - done;
        document.getElementById("total").textContent = total;
        document.getElementById("todo").textContent = todo;
        document.getElementById("done").textContent = done;
        document.getElementById("pbar").style.width =
          (total ? (done / total) * 100 : 0) + "%";
      }
      function filt(f, btn) {
        curFilter = f;
        document
          .querySelectorAll(".btns button")
          .forEach((b) => b.classList.remove("on"));
        if (btn) btn.classList.add("on");
        applyFilter();
      }
      function applyFilter() {
        document.querySelectorAll("tbody tr").forEach((tr) => {
          const done = tr.dataset.done === "1";
          let show = true;
          if (curFilter === "todo") show = !done;
          if (curFilter === "done") show = done;
          tr.classList.toggle("hide", !show);
        });
        // 整组若全隐藏则隐藏组标题
        document.querySelectorAll(".group").forEach((sec) => {
          const any = [...sec.querySelectorAll("tbody tr")].some(
            (tr) => !tr.classList.contains("hide"),
          );
          sec.classList.toggle("hide", !any);
        });
      }
      function resetAll() {
        if (!confirm("确定清空所有勾选？（全部重新变成「待改」）")) return;
        saved = {};
        localStorage.removeItem(KEY);
        render();
      }
      function expo() {
        const lines = [];
        let n = 0;
        GROUPS.forEach((g) => {
          const rows = DATA.map((d, i) => ({ d, i })).filter(
            (x) => x.d.level === g.k && !saved[idOf(x.d, x.i)],
          );
          if (!rows.length) return;
          lines.push("### " + g.label);
          rows.forEach(({ d, i }) => {
            n++;
            lines.push(
              `${d.file}:${d.line}  「${d.orig}」→「${d.sug}」  (${d.cn})`,
            );
          });
          lines.push("");
        });
        const txt = n ? lines.join("\n") : "（全部已确认，没有待改项）";
        document.getElementById("dlgTxt").value = txt;
        document.getElementById("dlgCnt").textContent = "共 " + n + " 条";
        document.getElementById("dlg").showModal();
      }
      function copyTxt() {
        const t = document.getElementById("dlgTxt");
        t.select();
        try {
          navigator.clipboard.writeText(t.value);
        } catch (e) {
          document.execCommand("copy");
        }
      }
      render();
    </script>
