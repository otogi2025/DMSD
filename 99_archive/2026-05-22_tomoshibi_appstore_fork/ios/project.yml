name: TomoshibiApp
options:
  bundleIdPrefix: com.itsuki
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: DCQ2KT5ZA9
    CODE_SIGN_STYLE: Automatic
    ENABLE_MODULE_VERIFIER: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"              # iPhone only
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
    Release:
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"

targets:
  TomoshibiApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TomoshibiApp
        excludes:
          - Assets.xcassets.empty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsuki.tomoshibi
        PRODUCT_NAME: TomoshibiApp
        # Xcode 14+ 现代写法：用 MARKETING_VERSION + CURRENT_PROJECT_VERSION（不用 INFOPLIST_KEY_CFBundleShortVersionString）
        # 2026-05-08 修：之前用 INFOPLIST_KEY_* 在 Xcode 26 + xcodegen 26 不生效，Archive Validate 报 CFBundleShortVersionString empty
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Tomoshibi
        INFOPLIST_KEY_NFCReaderUsageDescription: "寮の点呼で NFC カードを読み取り、出席を記録するために使用します。"
        CODE_SIGN_ENTITLEMENTS: TomoshibiApp/TomoshibiApp.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
