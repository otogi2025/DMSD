<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMSD 寮点呼システム</title>
  <!-- 加载样式表 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 顶部栏：标题 + 状态指示器 + 重置按钮 -->
  <header class="topbar">
    <div class="titles">
      <h1>DMSD 寮点呼システム</h1>
      <p class="subtitle">デモモード · 寮101号館 (4階建て)</p>
    </div>

    <div class="status-bar">
      <!-- 后端连接状态（由 JS 动态更新） -->
      <span id="conn-status" class="status-chip disconnected">🔴 サーバー未接続</span>
      <!-- 出席计数（由 JS 动态更新） -->
      <span id="attendance" class="status-chip">出席 0 / 24</span>
      <!-- 重置按钮（轮廓样式，次要操作） -->
      <button id="btn-reset" class="btn btn-secondary">リセット</button>
    </div>
  </header>

  <!-- 配置小横幅：显示当前 MAC_IP:PORT -->
  <div class="config-banner">
    現在のサーバー: <code id="api-base">—</code>
  </div>

  <!-- 房间网格主区域：24 间单人房间，一人一格 -->
  <main>
    <section id="room-grid" class="room-grid">
      <!-- 由 JS 动态生成 24 个房间格子 -->
    </section>
  </main>

  <!-- 演示控制台：NFC 失败时手动模拟刷卡 -->
  <footer class="console">
    <h2>デモコンソール</h2>
    <p class="console-hint">NFC読み取りに失敗した場合、以下のボタンでシミュレーション可能</p>
    <div class="console-buttons">
      <button class="btn btn-dashed" data-sim="S001">S001 シミュレーション (リュウイヒ)</button>
      <button class="btn btn-dashed" data-sim="S002">S002 シミュレーション (102号室)</button>
    </div>
  </footer>

  <!-- 右下角悬浮的通知区（toast），JS 向此处插入/移除通知元素 -->
  <div id="toast-area" class="toast-area" aria-live="polite"></div>

  <!-- 加载脚本（defer：文档解析完才执行） -->
  <script src="script.js" defer></script>
</body>
</html>
